# 发布流水线：推 v* tag 触发。macOS universal2（arm64+x86_64 胖包）dmg。
#
# 签名（与 LaterScreen 同思路）：secrets 里放自签名证书的 key/cert（base64），
# 导入临时 keychain 后用 LATERKEY_SIGN_IDENTITY=LaterKey 签 .app——TCC 绑定证书
# 身份，用户跨版本升级不用重新授权辅助功能。未配置 secret 时退回 ad-hoc。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: 测试（发布前再过一遍）
        run: cargo test --workspace

      - name: 导入签名证书（自签名，跨版本稳定 TCC 身份）
        env:
          LATERKEY_SIGN_KEY_PEM_B64: ${{ secrets.LATERKEY_SIGN_KEY_PEM_B64 }}
          LATERKEY_SIGN_CERT_PEM_B64: ${{ secrets.LATERKEY_SIGN_CERT_PEM_B64 }}
        run: |
          if [ -z "$LATERKEY_SIGN_KEY_PEM_B64" ]; then
            echo "::warning::未配置签名证书 secret，退回 ad-hoc 签名（升级需重新授权一次）"
            exit 0
          fi
          echo "$LATERKEY_SIGN_KEY_PEM_B64" | base64 -d > "$RUNNER_TEMP/laterkey-key.pem"
          echo "$LATERKEY_SIGN_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/laterkey-cert.pem"
          security create-keychain -p laterkey-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p laterkey-build build.keychain
          security import "$RUNNER_TEMP/laterkey-key.pem" -k build.keychain -T /usr/bin/codesign
          security import "$RUNNER_TEMP/laterkey-cert.pem" -k build.keychain -T /usr/bin/codesign
          # 构建（fat LTO）可能超过 keychain 默认 5 分钟自动上锁，禁用兜底
          security set-keychain-settings -t 43200 build.keychain
          # 自签名根必须进信任域，codesign 才认这个身份
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k build.keychain "$RUNNER_TEMP/laterkey-cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -k laterkey-build build.keychain
          rm -f "$RUNNER_TEMP/laterkey-key.pem"
          echo "LATERKEY_SIGN_IDENTITY=LaterKey" >> "$GITHUB_ENV"
          echo "LATERKEY_SIGN_KEYCHAIN=$HOME/Library/Keychains/build.keychain" >> "$GITHUB_ENV"

      - name: 打包（universal2 .app + dmg）
        run: |
          [ -z "${LATERKEY_SIGN_KEYCHAIN:-}" ] || \
            security unlock-keychain -p laterkey-build "$LATERKEY_SIGN_KEYCHAIN"
          bash scripts/package-macos.sh --universal

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal2
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      - name: 准备发布说明
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release_body.md
          else
            echo "此版本未提供发布说明，详见提交历史。" > release_body.md
          fi
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_body.md

  # 自动更新 homebrew-ailater 的 Casks/laterkey.rb（version + dmg sha256），
  # 免去每次发版后人工改 tap。需在 LaterKey 仓库配置 secrets.AILATER_TAP_TOKEN
  # （crazykun/homebrew-ailater 的 repo 写权限 token）；未配置时告警跳过，不算失败。
  bump-cask:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 检查 tap token（未配置则警告并跳过）
        id: tap-token
        env:
          AILATER_TAP_TOKEN: ${{ secrets.AILATER_TAP_TOKEN }}
        run: |
          if [ -z "$AILATER_TAP_TOKEN" ]; then
            echo "::warning::未配置 secrets.AILATER_TAP_TOKEN，跳过 homebrew-ailater 的 cask 自动更新（需手工改 Casks/laterkey.rb）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出 homebrew-ailater
        if: steps.tap-token.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: crazykun/homebrew-ailater
          token: ${{ secrets.AILATER_TAP_TOKEN }}
          path: homebrew-ailater

      - name: 按本 tag Release 的 SHA256SUMS 更新 cask 并推送
        if: steps.tap-token.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL --retry 3 -o SHA256SUMS \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS"
          # sha256sum 输出形如「<hash>␠␠xxx.dmg」，取 dmg 行第一列
          DMG_SHA=$(awk '$2 ~ /\.dmg$/ { print $1; exit }' SHA256SUMS)
          if ! printf '%s\n' "$DMG_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::SHA256SUMS 里没有合法的 .dmg sha256，内容："
            cat SHA256SUMS
            exit 1
          fi
          cd homebrew-ailater
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/laterkey.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${DMG_SHA}\"|" Casks/laterkey.rb
          # sed 没匹配上不会报错，这里兜底校验两行确实变成了目标值
          if ! grep -qxF "  version \"${VERSION}\"" Casks/laterkey.rb; then
            echo "::error::sed 后 version 行不是 ${VERSION}，cask 格式可能变了"
            exit 1
          fi
          if ! grep -qxF "  sha256 \"${DMG_SHA}\"" Casks/laterkey.rb; then
            echo "::error::sed 后 sha256 行不是 ${DMG_SHA}，cask 格式可能变了"
            exit 1
          fi
          # 注意：diff --quiet 无改动时返回 1，只能放在 if 条件里，不能裸做收尾
          if git diff --quiet -- Casks/laterkey.rb; then
            echo "cask 已是 ${VERSION}，无实际改动，跳过提交（可能重复发同一 tag）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/laterkey.rb
          git commit -m "laterkey ${VERSION}"
          git push origin master
