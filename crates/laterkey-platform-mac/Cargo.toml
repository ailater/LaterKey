[package]
name = "laterkey-platform-mac"
description = "LaterKey 的 macOS 平台层：事件拦截、前台应用跟踪、合成按键、锁屏、Dock"
version.workspace = true
edition.workspace = true
license.workspace = true

# 全部依赖都是 Apple 平台专用：Linux/Windows 上本 crate 编译为空（lib.rs 里 cfg 隔离），
# 依赖也必须收进 macOS 条件段，否则 Linux CI 会编 objc2 并 compile_error。
[target.'cfg(target_os = "macos")'.dependencies]
laterkey-core = { version = "0.1.0", path = "../laterkey-core" }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSString",
  "NSURL",
  "std",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSRunningApplication",
  "NSWorkspace",
  "libc",
  "std",
] }
