[package]
name = "laterkey-core"
description = "LaterKey 纯逻辑层：重映射规则与修饰键状态机，不依赖任何系统 API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# 只在单测里验证 JSON 往返；app 侧落盘时自己加正式依赖
[dev-dependencies]
serde_json = "1"
